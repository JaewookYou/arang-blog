name: Deploy to Production (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 동시 실행 방지 - 이전 빌드 취소하고 최신만 실행
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -e
            
            DEPLOY_DIR="/home/arang/web/blog"
            cd "$DEPLOY_DIR"
            
            echo "🚀 Starting Docker deployment..."
            echo "📂 Directory: $DEPLOY_DIR"
            
            # 1. 최신 코드 Pull
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Docker 이미지 빌드 후 교체
            #    빌드를 먼저 하고 성공했을 때만 컨테이너를 바꾼다.
            #    (예전에는 down을 먼저 해서 빌드가 실패하면 사이트가 내려간 채로 남았다)
            echo "🐳 Building Docker image..."
            docker compose build --no-cache
            echo "🔁 Replacing container..."
            docker compose up -d --remove-orphans
            
            # 3. 컨테이너 상태 확인
            echo "🔍 Checking container health..."
            sleep 10
            
            if docker compose ps | grep -q "Up"; then
              echo "✅ Container is running!"
            else
              echo "❌ Container failed to start!"
              docker compose logs --tail=50
              exit 1
            fi
            
            # 4. 헬스체크 검증
            echo "🏥 Verifying health check..."
            for i in {1..10}; do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "❌ Health check failed!"
                docker compose logs --tail=50
                exit 1
              fi
              echo "⏳ Waiting for service... ($i/10)"
              sleep 5
            done
            
            # 5. 오래된 이미지 정리
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Docker deployment completed at $(date)"
